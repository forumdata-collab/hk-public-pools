name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax + parser checks
        run: bash tools/check.sh

      - name: Live data sanity (non-blocking)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("https://pools.we1co.me/data/pools.json", timeout=25) as r:
              d = json.load(r)
          print("pools:", len(d["pools"]), "| districts:", len(d["districts"]), "| generatedAt:", d["generatedAt"])
          assert len(d["pools"]) >= 46, "expected >= 46 pools"
          assert d.get("schemaVersion"), "missing schemaVersion"
          PY
